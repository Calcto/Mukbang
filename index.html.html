<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мукбанг — и точка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8201a;--panel:#a8130f;--ink:#ffffff;--mute:#ffd9b0;--gold:#ffc72c;--red:#7a0f0b;--ok:#ffffff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-weight:500;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.coins{text-align:center;margin:8px 0 2px;font-weight:800;font-size:46px;line-height:1;display:flex;justify-content:center;align-items:center;gap:10px}
.coins i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#6b3d00;font-size:22px;display:grid;place-items:center;box-shadow:inset -3px -3px 0 #d98e00}
.sub{text-align:center;color:var(--mute);font-size:14px}
.stage{flex:1;display:grid;place-items:center;position:relative;min-height:0}
#food{font-size:min(52vw,230px);line-height:1;border:0;background:none;padding:0;cursor:pointer;transition:transform .08s;filter:drop-shadow(0 14px 0 rgba(0,0,0,.25));touch-action:manipulation}
#food.hit{transform:scale(.88) rotate(-4deg)}
.pop{position:absolute;pointer-events:none;font-weight:800;font-size:26px;color:var(--gold);animation:up .8s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.35)}
@keyframes up{to{transform:translateY(-110px);opacity:0}}
.bar{height:14px;border-radius:9px;background:var(--panel);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--red);transition:width .1s}
.bar.e b{background:var(--ok)}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:8px 0 4px}
.shop{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.shop button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px}
.shop button strong{display:block;font-weight:800;font-size:15px;margin-bottom:2px}
.shop button span{color:var(--gold);font-weight:800}
.shop button:disabled{opacity:.45}
.shop button:focus-visible,#food:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.egg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);background:var(--gold);color:#4a2800;font-weight:800;font-size:20px;padding:14px 20px;border-radius:16px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5;max-width:90vw}.egg.on{opacity:1;transform:translate(-50%,0)}
#food{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -9px}}
#food.spawn{animation:bob 2.4s ease-in-out infinite,spawn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes spawn{0%{scale:0;rotate:-40deg}100%{scale:1;rotate:0deg}}
.crumb{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:crumb .55s ease-out forwards}
@keyframes crumb{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#coins{display:inline-block}
.snd{font:inherit;font-size:18px;background:var(--panel);color:var(--ink);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer}
.snd:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dock{display:flex;gap:10px;align-items:center;margin-top:12px}
.shopbtn{flex:1;position:relative;font:inherit;font-weight:800;font-size:17px;color:#4a2800;background:var(--gold);border:0;border-radius:16px;height:52px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.shopbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.shopbtn i{position:absolute;top:8px;right:12px;width:11px;height:11px;border-radius:50%;background:var(--red)}
.shopbtn i[hidden]{display:none}
.abil{display:flex;gap:8px}
.ab{position:relative;width:52px;height:52px;border-radius:16px;border:0;background:var(--panel);font-size:26px;cursor:pointer;padding:0}
.ab[hidden]{display:none}
.ab:disabled{opacity:.55}
.ab small{position:absolute;bottom:2px;right:6px;font-size:12px;font-weight:800;color:var(--gold)}
.ab.on{box-shadow:0 0 0 3px var(--gold)}
.ab:focus-visible,.shopbtn:focus-visible,.tab:focus-visible,.buy:focus-visible,.x:focus-visible{outline:3px solid #fff;outline-offset:2px}
body.boost .stage::before{box-shadow:0 0 0 6px var(--gold),0 0 44px var(--gold)}
.sheetBg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.sheetBg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:480px;margin:0 auto;height:74%;display:flex;flex-direction:column;background:var(--panel);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1);padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:2px auto 8px}
.shHead{display:flex;align-items:center;gap:10px}
.shHead h2{margin:0;font-size:22px;font-weight:800;flex:1}
.bal{font-weight:800;color:var(--gold)}
.x{font:inherit;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;font:inherit;font-weight:800;font-size:14px;padding:10px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.tab.on{background:#fff;color:#a8130f}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:16px;padding:10px}
.ico{flex:none;width:50px;height:50px;border-radius:14px;background:var(--gold);display:grid;place-items:center;font-size:28px}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mute)}
.meta b{color:#fff;font-size:15px}
.meta small{color:var(--gold);font-weight:800}
.buy{flex:none;font:inherit;font-weight:800;font-size:14px;min-width:84px;padding:10px 8px;border:0;border-radius:12px;background:var(--gold);color:#4a2800;cursor:pointer}
.buy:disabled{opacity:.45}
@media (prefers-reduced-motion:reduce){.sheet,.sheetBg{transition:none}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden],#pConfirm[hidden],#pReset[hidden]{display:none}
.card{width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.card h2{margin:0 0 6px;font-size:22px;font-weight:800}
#stats{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:12px 0 8px;font-size:15px}
#stats dt{color:var(--mute)}#stats dd{margin:0;font-weight:800;text-align:right}
#pConfirm p{margin:14px 0 0;color:var(--mute);font-size:14px}
.pbtn{font:inherit;font-weight:800;width:100%;padding:13px;border:0;border-radius:14px;margin-top:8px;background:var(--gold);color:#4a2800;cursor:pointer}
.pbtn.danger{background:#7a0f0b;color:#fff}
.pbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.scare{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000}
.scare.on{display:flex;animation:zoom .35s ease-out}
.scare .face{width:100%;height:100%;object-fit:contain;display:block}
.scare b{font-size:min(10vw,44px);color:#e00;font-weight:800}
@keyframes zoom{from{scale:.3}to{scale:1}}
@media (prefers-reduced-motion:reduce){.scare.on{animation:none}}
.brand{text-align:center;font-weight:800;font-size:24px;margin-top:6px;letter-spacing:-.01em}
.brand b{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--gold);margin-left:.18em}
.stage::before{content:"";position:absolute;width:min(72vw,310px);aspect-ratio:1;border-radius:50%;background:var(--gold);box-shadow:0 10px 0 rgba(0,0,0,.22)}
#food{position:relative;z-index:1}
.pop{color:#fff}
.bar b{background:var(--gold)}
.bar.e b,.bar.e.low b{background:#fff}
.stage::before{background:#fff}
#food{filter:none;mix-blend-mode:multiply;font-size:0}
#food img{display:block;width:min(60vw,260px);height:auto;pointer-events:none;-webkit-user-drag:none}
.pop{color:var(--gold);text-shadow:0 2px 0 #7a0f0b,0 0 8px #7a0f0b}
#coins.bump{animation:bump .16s ease-out}
@keyframes bump{50%{transform:scale(1.14)}}
.bar.e.low b{animation:blink .7s ease-in-out infinite;background:var(--red)}
@keyframes blink{50%{opacity:.4}}
.shop button:not(:disabled){animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold)}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}#food,#food.spawn,#coins.bump,.bar.e.low b,.shop button{animation:none}#food{transition:none}}
</style>
</head>
<body>
<div class="egg" id="egg" role="status"></div>
<div class="sheetBg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Магазин" inert>
  <div class="grab"></div>
  <div class="shHead"><h2>Магазин</h2><span class="bal">₽ <b id="shBal">0</b></span><button id="shClose" class="x" aria-label="Закрыть">✕</button></div>
  <div class="tabs"><button id="tabU" class="tab on">Улучшения</button><button id="tabA" class="tab">Способности</button></div>
  <div class="list" id="shopList"></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Профиль" hidden>
  <div class="card">
    <h2>Профиль</h2>
    <dl id="stats"></dl>
    <button id="pClose" class="pbtn">Закрыть</button>
    <button id="pReset" class="pbtn danger">Сбросить всё</button>

      <p>Весь прогресс удалится без возврата. Сбросить?</p>
      <button id="pYes" class="pbtn danger">Да, сбросить всё</button>
      <button id="pNo" class="pbtn">Отмена</button>
    </div>
  </div>
</div>

function tone(f,d,type,vol,slide){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;

}
function crunch(){

  const len=Math.floor(a.sampleRate*.09),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);

    const l=a.createOscillator(),lg=a.createGain();l.frequency.value=9;lg.gain.value=70;l.connect(lg);l.start(t);l.stop(t+d);
    [["sawtooth",0],["square",9],["sawtooth",-14]].forEach(([type,det])=>{
      const o=a.createOscillator();o.type=type;
      o.frequency.setValueAtTime(480,t);o.frequency.exponentialRampToValueAtTime(1350,t+.3);o.frequency.linearRampToValueAtTime(980,t+d);
      o.detune.value=det;lg.connect(o.frequency);o.connect(ws);o.start(t);o.stop(t+d);
    });
    crunch();tone(70,.7,"sine",.45,35);
  }
};
$("snd").textContent=muted?"🔇":"🔊";
$("snd").addEventListener("click",()=>{
  muted=!muted;$("snd").textContent=muted?"🔇":"🔊";
  try{localStorage.setItem("mukbang_mute",muted?"1":"0")}catch(_){}
  if(!muted)sfx.buy();
});
let rows=[],tab="u";
const abBtns=[];
function mk(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function gainPerTap(){return Math.round(S.tap*(1+.1*S.l5)*(Date.now()<S.boostEnd?3:1))}
function popCenter(t){const r=$("food").getBoundingClientRect();pop(r.left+r.width/2,r.top+r.height/2,t)}
function buildShop(){
  const list=$("shopList");list.textContent="";rows=[];
  (tab==="u"?U:A).forEach(it=>{
    const row=mk("div","item"),meta=mk("div","meta"),nm=mk("b","",it.name),lv=mk("small","",""),btn=mk("button","buy","");
    nm.append(" ",lv);meta.append(nm,mk("span","",it.desc));
    row.append(mk("div","ico",it.icon),meta,btn);list.append(row);
    btn.addEventListener("click",()=>buyItem(it));
    rows.push({it,lv,btn});
  });
  updateShop();
}
function buyItem(it){
  if(tab==="u"){const c=cost(it.base,S[it.key]);if(S.coins<c)return;S.coins-=c;S[it.key]++;it.fn()}
  else{if(S[it.id]||S.coins<it.price)return;S.coins-=it.price;S[it.id]=1}
  sfx.buy();render();save();
}
function updateShop(){
  $("shBal").textContent=fmt(S.coins);
  rows.forEach(({it,lv,btn})=>{
    if(tab==="u"){const c=cost(it.base,S[it.key]);lv.textContent="ур. "+S[it.key];btn.textContent=fmt(c)+" ₽";btn.disabled=S.coins<c}
    else{const own=S[it.id];lv.textContent=own?"куплено · перезарядка "+it.cd+" с":"";btn.textContent=own?"Есть":fmt(it.price)+" ₽";btn.disabled=!!own||S.coins<it.price}
  });
  $("shopDot").hidden=!(U.some(u=>S.coins>=cost(u.base,S[u.key]))||A.some(a=>!S[a.id]&&S.coins>=a.price));
}
function openShop(){buildShop();$("sheet").inert=false;$("sheetBg").classList.add("open");$("sheet").classList.add("open");$("shClose").focus()}
function closeShop(){$("sheet").classList.remove("open");$("sheetBg").classList.remove("open");$("sheet").inert=true;$("shopBtn").focus()}
function setTab(t){tab=t;$("tabU").classList.toggle("on",t==="u");$("tabA").classList.toggle("on",t==="a");buildShop()}
A.forEach(a=>{
  const b=mk("button","ab",a.icon),sm=mk("small","","");
  b.hidden=true;b.setAttribute("aria-label",a.name);b.append(sm);
  b.addEventListener("click",()=>{if(Date.now()<S[a.ck])return;a.use();S[a.ck]=Date.now()+a.cd*1000;render();save()});
  $("abil").append(b);abBtns.push({a,b,sm});
});
function updateDock(){
  const now=Date.now();
  abBtns.forEach(({a,b,sm})=>{
    const left=S[a.ck]-now;
    b.hidden=!S[a.id];b.disabled=left>0;sm.textContent=left>0?Math.ceil(left/1000):"";
    b.classList.toggle("on",a.id==="a1"&&now<S.boostEnd);
  });
  document.body.classList.toggle("boost",now<S.boostEnd);
}
$("shopBtn").addEventListener("click",openShop);
$("shClose").addEventListener("click",closeShop);
$("sheetBg").addEventListener("click",closeShop);
$("tabU").addEventListener("click",()=>setTab("u"));
$("tabA").addEventListener("click",()=>setTab("a"));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("open"))closeShop()});
function fmtT(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60);return h?h+" ч "+m+" мин":m?m+" мин":t+" с"}
function openProfile(){
  const rows=[["Игрок",NAME||"Гость"],["Уровень",1+Math.floor(Math.sqrt(S.total/100))],["Коинов сейчас",fmt(S.coins)],["Всего заработано",fmt(S.total)],["Тапов",fmt(S.taps)],["Порций съедено",fmt(S.eaten)],["Время в игре",fmtT(S.secs)],["За тап","+"+S.tap],["В секунду",S.auto],["Максимум сил",S.max]];
  const dl=$("stats");dl.textContent="";
  rows.forEach(r=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=r[0];dd.textContent=r[1];dl.append(dt,dd)});
  $("pConfirm").hidden=true;$("pReset").hidden=false;$("modal").hidden=false;$("pClose").focus();
}
function closeProfile(){$("modal").hidden=true}
function resetAll(){
  S=Object.assign({},DEF);shownImg=-1;
  try{localStorage.removeItem("mukbang")}catch(_){}
  save();render();closeProfile();
}
$("prof").addEventListener("click",openProfile);
$("pClose").addEventListener("click",closeProfile);
$("pReset").addEventListener("click",()=>{$("pReset").hidden=true;$("pConfirm").hidden=false;$("pNo").focus()});
$("pNo").addEventListener("click",()=>{$("pConfirm").hidden=true;$("pReset").hidden=false});
$("pYes").addEventListener("click",resetAll);
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeProfile()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeProfile()});
let scareAt=0,scareShown=0,scareT,bc=0,bt;
function scare(force){
  const n=Date.now();if(!force&&n-scareAt<60000)return;
  scareAt=scareShown=n;$("scare").classList.add("on");sfx.scream();
  try{navigator.vibrate&&navigator.vibrate([200,80,200])}catch(_){}
  clearTimeout(scareT);scareT=setTimeout(()=>$("scare").classList.remove("on"),2300);
}
$("scare").addEventListener("pointerdown",()=>{if(Date.now()-scareShown>700)$("scare").classList.remove("on")});
document.querySelector(".brand").addEventListener("click",()=>{bc++;clearTimeout(bt);bt=setTimeout(()=>bc=0,1500);if(bc>=7){bc=0;scare(true)}});
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function burst(x,y,n){
  if(RM)return;
  const st=$("food").parentElement,r=st.getBoundingClientRect(),cols=["#ffffff","#ffc72c","#7a0f0b"];
  for(let i=0;i<n;i++){
    const c=document.createElement("i"),a=Math.random()*6.283,d=40+Math.random()*60;
    c.className="crumb";c.style.left=(x-r.left)+"px";c.style.top=(y-r.top)+"px";
    c.style.background=cols[i%3];
    c.style.setProperty("--dx",Math.cos(a)*d+"px");c.style.setProperty("--dy",Math.sin(a)*d+"px");
    st.appendChild(c);setTimeout(()=>c.remove(),600);
  }
}
$("food").addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(S.en<S.tap){pop(e.clientX,e.clientY,"нет сил");sfx.nope();return}
  const g=gainPerTap();S.en-=S.tap;S.coins+=g;S.total+=g;S.bites++;S.taps++;
  const f=$("food");f.classList.add("hit");setTimeout(()=>f.classList.remove("hit"),70);
  pop(e.clientX,e.clientY,Math.random()<.25?WORDS[Math.floor(Math.random()*WORDS.length)]:"+"+g);
  burst(e.clientX,e.clientY,6);restart($("coins"),"bump");sfx.tap();if(Math.random()<.003)scare();
  try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
  if(S.bites>=BITES){S.bites=0;S.eaten++;S.coins+=25*S.tap;pop(e.clientX,e.clientY-40,"порция! +"+25*S.tap);burst(e.clientX,e.clientY,18);S.spawn=1;sfx.portion()}
  render();
});
setInterval(()=>{
  S.en=Math.min(S.max,S.en+10+5*S.l4);S.secs++;
  if(S.auto){S.coins+=S.auto;S.total+=S.auto}
  render();
},1000);
setInterval(save,5000);
let eggT;
function showEgg(){const g=$("egg");g.textContent="Серега лох 🤡 мукбанг топ 🍔👑";g.classList.add("on");sfx.egg();clearTimeout(eggT);eggT=setTimeout(()=>g.classList.remove("on"),3500)}
let lc=0,lt;
$("lvl").addEventListener("click",()=>{lc++;clearTimeout(lt);lt=setTimeout(()=>lc=0,1500);if(lc>=5){lc=0;showEgg()}});
setInterval(()=>{if(S.total>=777&&!S.egg){S.egg=1;showEgg();save()}},500);
let NAME="";
try{
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){
    tg.ready();tg.expand();

    try{tg.setHeaderColor("#d8201a");tg.setBackgroundColor("#d8201a")}catch(_){}

render();
